[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mybot"
version = "0.1.0"
description = "Real-time intraday market intelligence and paper-trading system with hard risk controls"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
live = ["websockets>=12"]
dev = ["pytest>=8"]

[project.scripts]
mybot = "mybot.__main__:main"

[tool.setuptools.packages.find]
include = ["mybot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
